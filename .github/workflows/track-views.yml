name: Track Profile Views

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Track profile views
        run: python .github/scripts/track-views.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Dev9269"
          git config --global user.email "157703342+Dev9269@users.noreply.github.com"
          git add profile-views.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update profile views data [automated]"
            git push
          fi
