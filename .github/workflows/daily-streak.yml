name: Daily Streak

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update activity log
        run: |
          echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') — daily activity" >> activity-log.txt
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily activity $(date -u '+%Y-%m-%d')"
          commit_user_name: Dev9269
          commit_user_email: 157703342+Dev9269@users.noreply.github.com
