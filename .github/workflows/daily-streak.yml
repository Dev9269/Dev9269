name: Daily Streak

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 11 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update activity log
        id: log
        run: |
          today="$(date -u '+%Y-%m-%d')"
          if grep -q "^${today}T" activity-log.txt; then
            echo "Already logged for ${today}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') — daily activity" >> activity-log.txt
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "day=${today}" >> "$GITHUB_OUTPUT"
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.log.outputs.changed == 'true'
        with:
          commit_message: "chore: daily activity ${{ steps.log.outputs.day }}"
          commit_user_name: Dev9269
          commit_user_email: 157703342+Dev9269@users.noreply.github.com
