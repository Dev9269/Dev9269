name: Daily Streak

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update activity log
        run: |
          set -e
          N=$(( RANDOM % 43 + 8 ))
          echo "Making $N commits today"
          for i in $(seq 1 $N); do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') - streak #$i" >> activity-log.txt
            git config user.name "Dev9269"
            git config user.email "157703342+Dev9269@users.noreply.github.com"
            git add activity-log.txt
            git commit -m "chore: daily activity $(date -u '+%Y-%m-%d') (#$i)" >/dev/null
          done
          git push
